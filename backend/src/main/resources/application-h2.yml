# Profil H2 (test rapide sans MySQL)
spring:
  datasource:
    url: jdbc:h2:mem:gns_sirh;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
