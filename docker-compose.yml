# MySQL 8 pour le SIRH GNS — correspond aux valeurs par défaut de
# backend/src/main/resources/application-mysql.yml (port 3307, base gns_sirh, root/root).
#
# Démarrage :  docker compose up -d
# Backend :    MYSQL_PASSWORD=root mvn spring-boot:run        (profil mysql par défaut)
# Sans Docker, utilisez simplement le profil H2 :  mvn spring-boot:run -Dspring-boot.run.profiles=h2file
services:
  mysql:
    image: mysql:8.0
    container_name: gns_sirh_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gns_sirh
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
